name: Dependency verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  verify:
    name: Audit, lint, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build without deployment
        run: npm run build-prod

      - name: Smoke test development server
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/webpack-dev-server.log"
          npm start -- --port 0 >"${log_file}" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            if grep -q "compiled.*successfully" "${log_file}"; then
              cat "${log_file}"
              exit 0
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${log_file}"
              exit 1
            fi
            sleep 1
          done

          cat "${log_file}"
          exit 1
